name: fitness_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & DI
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0
  get_it: ^9.2.1
  injectable: ^3.0.0

  # Networking & Serialization
  dio: ^5.11.0
  retrofit: ^4.9.2
  pretty_dio_logger: ^1.4.0
  json_annotation: ^4.12.0

  # Routing & Localization
  go_router: ^16.2.0
  easy_localization: ^3.0.8

  # UI, Storage & Utils
  pinput: ^6.0.2
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.6
  uuid: ^4.5.1
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  plugin_platform_interface: ^2.1.8
  flutter_dotenv: ^6.0.1
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  molten_navigationbar_flutter: ^1.0.1
  youtube_player_iframe: ^6.0.2

  # Firebase & Authentication
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  google_sign_in: ^6.2.2
  firebase_auth: ^5.4.4
  flutter_facebook_auth: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Generators & Build Tools
  build_runner: 2.15.1
  injectable_generator: ^3.1.3
  retrofit_generator: 10.2.7
  json_serializable: ^6.15.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

  # Testing
  bloc_test: ^10.0.0
  mockito: ^5.6.4
  mocktail: ^1.0.5
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    # - .env

flutter_native_splash:
  color: "#1E1E1E"
  image: assets/images/splash_logo.png
  android: true
  ios: false
  web: false

  android_12:
    color: "#1E1E1E"
    image: assets/images/splash_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/launcher_icon.png
  adaptive_icon_background: "#1E1E1E"