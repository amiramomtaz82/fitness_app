name: Automated Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  test:
    name: Run Unit & Widget Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-:hash:'

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Build Runner (Generate Code)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Automated Test Suite
        id: run_tests
        run: flutter test --file-reporter json:test-results.json
        continue-on-error: true

      - name: Parse & Publish Test Summary
        id: parse_summary
        if: always()
        run: dart run tool/generate_test_summary.dart test-results.json test_summary.md
        continue-on-error: true

      - name: Publish Test Summary to PR Comment
        uses: actions/github-script@v7
        if: always() && github.event_name == 'pull_request' && hashFiles('test_summary.md') != ''
        continue-on-error: true
        with:
          script: |
            const fs = require('fs');
            if (!fs.existsSync('test_summary.md')) return;
            const summary = fs.readFileSync('test_summary.md', 'utf8');
            const commentHeader = '<!-- flutter-test-summary-marker -->';
            const body = `${commentHeader}\n${summary}\n\n*Reported automatically by GitHub Actions workflow on PR event.*`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existingComment = comments.find(comment => comment.body.includes(commentHeader));

              if (existingComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existingComment.id,
                  body: body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: body,
                });
              }
            } catch (err) {
              console.log('Could not post comment to PR (may lack fork permissions):', err.message);
            }

      - name: Check Final Test Result
        if: always()
        run: |
          if [ "${{ steps.run_tests.outcome }}" != "success" ]; then
            echo "================================================================================"
            echo "❌ AUTOMATED TESTS FAILED"
            echo "================================================================================"
            echo "One or more unit or widget tests failed. Review the test summary and logs."
            echo "PR merge is blocked until all test failures are resolved."
            echo "================================================================================"
            exit 1
          fi
          echo "================================================================================"
          echo "✅ ALL AUTOMATED TESTS PASSED"
          echo "================================================================================"
